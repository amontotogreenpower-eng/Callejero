/* ---------- audio ---------- */
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function tone(f,d,type='square',vol=.05,slide=0){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
}
let NB=null;
function noise(d,vol,fc){if(!AC)return;
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);
    const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const src=AC.createBufferSource();src.buffer=NB;src.loop=true;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fc||800;f.Q.value=.85;
  const g=AC.createGain();g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  src.connect(f);f.connect(g);g.connect(AC.destination);src.start();src.stop(AC.currentTime+d);
}

  dash:()=>tone(240,.07,'triangle',.04,180),
  super:()=>{tone(200,.5,'sawtooth',.07,600);tone(400,.5,'square',.04,900);}};

function playMusic(st){
  if(music.cur===st&&music.int)return;
  stopMusic();const M=MUSIC[st];if(!M)return;music.cur=st;
  const stepMs=60000/M.bpm/2;let i=0;
  music.int=setInterval(()=>{if(!AC)return;
    const b=M.bass[i%8],l=M.lead[i%8];
    if(b)tone(b,stepMs/1000*.95,'triangle',.05);
    if(l)tone(l,stepMs/1000*.55,M.type,.02);
    if(i%4===2)noise(.04,.045,1600);
    if(i%8===0)tone(52,.12,'sine',.09);
    if(st==='arena'&&i%16===8)noise(.7,.035,420);
    i++;},stepMs);
}
function stopMusic(){if(music.int){clearInterval(music.int);music.int=null;}music.cur=null;}

    el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
    ui.appendChild(el);

function poseLerp(a,b,t){const o={};for(const k of PK)o[k]=lerp(a[k],b[k],t);return o;}
function track(list,t){
  if(t<=list[0][0])return list[0][1];
  for(let i=0;i<list.length-1;i++){const[t0,p0]=list[i],[t1,p1]=list[i+1];
    if(t>=t0&&t<=t1){const u=t1>t0?(t-t0)/(t1-t0):1;return poseLerp(p0,p1,ease(u));}}
  return list[list.length-1][1];
}

const dustCount=180;

  dustPos[i*3]=(Math.random()-0.5)*80;
  dustPos[i*3+1]=Math.random()*8+0.3;

  const p=dustParticles.geometry.attributes.position.array;
  for(let i=0;i<dustCount;i++){
    p[i*3]+=dustVel[i].x; p[i*3+1]+=dustVel[i].y; p[i*3+2]+=dustVel[i].z;

      const fg=new THREE.Group();l.end.add(fg);
      const ff=new THREE.Group();ff.rotation.z=-Math.PI/2;fg.add(ff);
      const fm=this.box(d.limbW*2.1,d.limbW*.9,d.limbW*1.1,foot);
      fm.position.set(d.limbW*.55*s,-d.limbW*.35*s,0);ff.add(fm);
      return{u:u.g,l:l.g,foot:fg,hold};
    };
    const lF=mkLeg(zL,leg), lB=mkLeg(-zL,legB);
    this.legUF=lF.u;this.legLF=lF.l;this.footF=lF.foot;this.holdLF=lF.hold;
    this.legUB=lB.u;this.legLB=lB.l;this.footB=lB.foot;this.holdLB=lB.hold;
    if(C.build)C.build(this);
    this.joints={pel:this.pel,chest:this.chest,headC:this.headJ,handF:this.handF,handB:this.handB,
      footF:this.footF,footB:this.footB,kneF:this.legLF,kneB:this.legLB};
    this._v=new THREE.Vector3();
  }
  dark(c){const col=new THREE.Color(c);col.multiplyScalar(.72);return col.getHex();}
  mkMat(c){
    const m=new THREE.MeshStandardMaterial({color:c, roughness:0.6, metalness:0.1, emissive:new THREE.Color(0x000000)});
    this.M.push(m);this.M_std.push(m);return m;}
  glowMat(c){const m=new THREE.MeshBasicMaterial({color:c});this.M.push(m);return m;}
  bone(parent,len,rad,mat,taper){
    taper=taper===undefined?1:taper;
    const g=new THREE.Group();parent.add(g);
    const cy=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad*taper,len,12),mat);
    cy.position.y=-len/2;cy.castShadow=true;g.add(cy);
    const a=new THREE.Mesh(new THREE.SphereGeometry(rad,12,9),mat);a.castShadow=true;g.add(a);
    const b=new THREE.Mesh(new THREE.SphereGeometry(rad*taper,12,9),mat);b.position.y=-len;b.castShadow=true;g.add(b);
    const end=new THREE.Group();end.position.y=-len;g.add(end);
    return{g,end};
  }
  pos(m,x,y,z){m.position.set((x||0)*this.s,(y||0)*this.s,(z||0)*this.s);return m;}
  ring(r,tube,mat){const m=new THREE.Mesh(new THREE.TorusGeometry(r*this.s,tube*this.s,10,28),mat);return m;}
  ball(r,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(r*this.s,18,14),mat);m.castShadow=true;return m;}
  hball(r,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(r*this.s,72,54),mat);m.castShadow=true;return m;}
  fball(r,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(r*this.s,36,28),mat);m.castShadow=true;return m;}
  skinMat(c){const m=new THREE.MeshStandardMaterial({color:c, roughness:0.7, metalness:0.05});this.M.push(m);return m;}
  ears(mat,o){...} // igual que antes
  sideburns(mat,o){...}
  hairCap(hex,o){...}
  face2(o){...}
  face(o){...}
  cyl(r,len,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(r*this.s,r*this.s,len*this.s,12),mat);m.castShadow=true;return m;}
  box(a,b,c,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(a*this.s,b*this.s,c*this.s),mat);m.castShadow=true;return m;}
  apply(p,facing,groundY,plant){
    const R=v=>(180-v)*D, rel=(a,b)=>(a-b)*D;
    this.root.rotation.y=facing===1?-YAW:Math.PI+YAW;
    this.holdAF.position.z=this.zA*facing;this.holdAB.position.z=-this.zA*facing;
    this.holdLF.position.z=this.zL*facing;this.holdLB.position.z=-this.zL*facing;
    this.head.rotation.y=facing===1?-YAW*.8:YAW*.8;
    this.pel.rotation.z=-(p.rot||0)*D;
    this.pel.position.y=-p.py*this.s;
    this.torso.rotation.z=R(p.torso);
    this.neck.rotation.z=rel(p.torso,p.head);
    this.armUF.rotation.z=rel(p.torso,p.armUF);this.armLF.rotation.z=rel(p.armUF,p.armLF);
    this.armUB.rotation.z=rel(p.torso,p.armUB);this.armLB.rotation.z=rel(p.armUB,p.armLB);
    this.legUF.rotation.z=R(p.legUF);this.legLF.rotation.z=rel(p.legUF,p.legLF);
    this.legUB.rotation.z=R(p.legUB);this.legLB.rotation.z=rel(p.legUB,p.legLB);
    this.footF.rotation.z=(p.legLF-90)*D;this.footB.rotation.z=(p.legLB-90)*D;
    this.root.position.y=0;this.root.updateMatrixWorld(true);
    let dy=0;
    if(plant==='both')dy=-Math.min(this.wy(this.footF),this.wy(this.footB));
    else if(plant==='back')dy=-this.wy(this.footB);
    this.root.position.y=groundY+dy;
    this.root.updateMatrixWorld(true);
  }
  wy(o){o.getWorldPosition(this._v);return this._v.y;}
  joint(n){const o=this.joints[n];const v=new THREE.Vector3();o.getWorldPosition(v);return v;}
  tick(t){for(const f of this.extras)f(t);}
  setGlow(color){
    for(const m of this.M_std){if(m.emissive){m.emissive.setHex(color);m.emissiveIntensity=0.4;}}
  }
  clearGlow(){
    for(const m of this.M_std){if(m.emissive){m.emissive.setHex(0x000000);m.emissiveIntensity=0;}}
  }
  dispose(){...} // igual que antes
}

  const g=new THREE.Mesh(new THREE.PlaneGeometry(size||60,40),m);
  g.rotation.x=-Math.PI/2;g.receiveShadow=true;return g;

// Modificación en el loop:
function loop(){
  T0=performance.now()*.06;
  update();
  tickStage(T0);tickShowcase(T0);tickCam(T0);
  // Actualizar polvo
  updateDust();
  // Actualizar glow de super
  if(p1&&p2){p1.meter>=100?p1.rig.setGlow(p1.c.pal.accent):p1.rig.clearGlow();
    p2.meter>=100?p2.rig.setGlow(p2.c.pal.accent):p2.rig.clearGlow();}
  composer.render();
  drawHUD();
  for(const k in just)just[k]=false;
  requestAnimationFrame(loop);
}
